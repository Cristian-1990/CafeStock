<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="820" viewBox="0 0 1250 820" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6D4C41"/>
    </marker>
  </defs>

  <!-- Fondo -->
  <rect x="0" y="0" width="1250" height="820" fill="#F5EFE6"/>

  <!-- Titulo -->
  <text x="625" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#3E2723">CafeStock — Diagrama de Secuencia</text>
  <text x="625" y="50" text-anchor="middle" font-size="12" font-style="italic" fill="#6D4C41">Confirmar recepción de pedido (con recepción parcial)</text>

  <!-- ===================== LINEAS DE VIDA ===================== -->
  <line x1="110" y1="134" x2="110" y2="650" stroke="#6D4C41" stroke-width="1.3" stroke-dasharray="5,4"/>
  <line x1="340" y1="120" x2="340" y2="650" stroke="#6D4C41" stroke-width="1.3" stroke-dasharray="5,4"/>
  <line x1="590" y1="120" x2="590" y2="650" stroke="#6D4C41" stroke-width="1.3" stroke-dasharray="5,4"/>
  <line x1="840" y1="120" x2="840" y2="650" stroke="#6D4C41" stroke-width="1.3" stroke-dasharray="5,4"/>
  <line x1="1090" y1="120" x2="1090" y2="650" stroke="#6D4C41" stroke-width="1.3" stroke-dasharray="5,4"/>

  <!-- ===================== ACTIVACIONES ===================== -->
  <rect x="335" y="195" width="10" height="420" fill="#F5EFE6" stroke="#6D4C41" stroke-width="1.5"/>
  <rect x="585" y="245" width="10" height="240" fill="#F5EFE6" stroke="#6D4C41" stroke-width="1.5"/>
  <rect x="835" y="315" width="10" height="130" fill="#F5EFE6" stroke="#6D4C41" stroke-width="1.5"/>
  <rect x="1085" y="355" width="10" height="50" fill="#F5EFE6" stroke="#6D4C41" stroke-width="1.5"/>
  <rect x="1085" y="525" width="10" height="50" fill="#F5EFE6" stroke="#6D4C41" stroke-width="1.5"/>

  <!-- ===================== MENSAJES ===================== -->
  <!-- 1 -->
  <line x1="125" y1="160" x2="335" y2="160" stroke="#6D4C41" stroke-width="1.6" marker-end="url(#flecha)"/>
  <text x="230" y="153" text-anchor="middle" font-size="12" fill="#2C2C2A">1: introduce cantidad recibida</text>

  <!-- 2 -->
  <line x1="125" y1="200" x2="335" y2="200" stroke="#6D4C41" stroke-width="1.6" marker-end="url(#flecha)"/>
  <text x="230" y="193" text-anchor="middle" font-size="12" fill="#2C2C2A">2: clic "Confirmar recepción"</text>

  <!-- 3 -->
  <line x1="345" y1="250" x2="585" y2="250" stroke="#6D4C41" stroke-width="1.6" marker-end="url(#flecha)"/>
  <text x="465" y="243" text-anchor="middle" font-size="11" fill="#2C2C2A">3: ConfirmarRecepcionAsync(id, cantidad)</text>

  <!-- self-note: validar > 0 -->
  <polyline points="595,278 660,278 660,296 596,296" fill="none" stroke="#6D4C41" stroke-width="1.4" marker-end="url(#flecha)"/>
  <text x="602" y="272" font-size="11" fill="#2C2C2A">3a: valida cantidad &gt; 0</text>

  <!-- 4 -->
  <line x1="595" y1="320" x2="835" y2="320" stroke="#6D4C41" stroke-width="1.6" marker-end="url(#flecha)"/>
  <text x="715" y="313" text-anchor="middle" font-size="11" fill="#2C2C2A">4: ConfirmarRecepcionAsync(id, cantidad)</text>

  <!-- 5 -->
  <line x1="845" y1="360" x2="1085" y2="360" stroke="#6D4C41" stroke-width="1.6" marker-end="url(#flecha)"/>
  <text x="965" y="353" text-anchor="middle" font-size="11" fill="#2C2C2A">5: UPDATE StockActual += cantidad</text>

  <!-- 6 (retorno) -->
  <line x1="1085" y1="400" x2="845" y2="400" stroke="#6D4C41" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#flecha)"/>
  <text x="965" y="393" text-anchor="middle" font-size="11" font-style="italic" fill="#3E2723">6: fila actualizada</text>

  <!-- 7 (retorno) -->
  <line x1="835" y1="440" x2="595" y2="440" stroke="#6D4C41" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#flecha)"/>
  <text x="715" y="433" text-anchor="middle" font-size="11" font-style="italic" fill="#3E2723">7: Producto (StockActual, CantidadAComprar)</text>

  <!-- 8 (retorno) -->
  <line x1="585" y1="480" x2="345" y2="480" stroke="#6D4C41" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#flecha)"/>
  <text x="465" y="473" text-anchor="middle" font-size="11" font-style="italic" fill="#3E2723">8: Result&lt;Producto&gt;</text>

  <!-- 9 -->
  <line x1="345" y1="530" x2="1085" y2="530" stroke="#6D4C41" stroke-width="1.6" marker-end="url(#flecha)"/>
  <text x="715" y="523" text-anchor="middle" font-size="11" fill="#2C2C2A">9: crear Compra + LineaCompra (vía CompraService → CompraRepository)</text>

  <!-- 10 (retorno) -->
  <line x1="1085" y1="570" x2="345" y2="570" stroke="#6D4C41" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#flecha)"/>
  <text x="715" y="563" text-anchor="middle" font-size="11" font-style="italic" fill="#3E2723">10: Compra creada</text>

  <!-- 11 -->
  <line x1="335" y1="610" x2="125" y2="610" stroke="#6D4C41" stroke-width="1.6" marker-end="url(#flecha)"/>
  <text x="230" y="603" text-anchor="middle" font-size="12" fill="#2C2C2A">11: Snackbar "Recepción confirmada"</text>

  <!-- ===================== CABECERAS ===================== -->
  <!-- Trabajador (actor) -->
  <g>
    <circle cx="110" cy="76" r="9" fill="#F5EFE6" stroke="#6D4C41" stroke-width="2"/>
    <line x1="110" y1="85" x2="110" y2="107" stroke="#6D4C41" stroke-width="2"/>
    <line x1="96" y1="94" x2="124" y2="94" stroke="#6D4C41" stroke-width="2"/>
    <line x1="110" y1="107" x2="98" y2="122" stroke="#6D4C41" stroke-width="2"/>
    <line x1="110" y1="107" x2="122" y2="122" stroke="#6D4C41" stroke-width="2"/>
    <text x="110" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#3E2723">Trabajador</text>
  </g>

  <!-- ListaCompra.razor -->
  <g>
    <rect x="240" y="70" width="200" height="50" fill="#F5EFE6" stroke="#6D4C41" stroke-width="2"/>
    <text x="340" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#3E2723">ListaCompra.razor</text>
    <text x="340" y="109" text-anchor="middle" font-size="10" font-style="italic" fill="#6D4C41">(UI)</text>
  </g>

  <!-- ProductoService -->
  <g>
    <rect x="495" y="70" width="190" height="50" fill="#F5EFE6" stroke="#6D4C41" stroke-width="2"/>
    <text x="590" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#3E2723">ProductoService</text>
    <text x="590" y="109" text-anchor="middle" font-size="10" font-style="italic" fill="#6D4C41">(reglas de negocio)</text>
  </g>

  <!-- ProductoRepository -->
  <g>
    <rect x="740" y="70" width="200" height="50" fill="#F5EFE6" stroke="#6D4C41" stroke-width="2"/>
    <text x="840" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#3E2723">ProductoRepository</text>
    <text x="840" y="109" text-anchor="middle" font-size="10" font-style="italic" fill="#6D4C41">(persistencia EF Core)</text>
  </g>

  <!-- Base de datos -->
  <g>
    <rect x="1005" y="70" width="170" height="50" fill="#F5EFE6" stroke="#6D4C41" stroke-width="2"/>
    <text x="1090" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#3E2723">Base de datos</text>
    <text x="1090" y="109" text-anchor="middle" font-size="10" font-style="italic" fill="#6D4C41">(SQLite)</text>
  </g>

  <!-- ===================== LEYENDA ===================== -->
  <rect x="60" y="750" width="1130" height="42" fill="#F5EFE6" stroke="#C17817" stroke-width="1.5"/>
  <text x="625" y="776" text-anchor="middle" font-size="13" fill="#3E2723">
    Línea continua = llamada síncrona&#160;&#160;&#160;|&#160;&#160;&#160;línea discontinua = retorno&#160;&#160;&#160;|&#160;&#160;&#160;rectángulo fino sobre la línea de vida = activación (procesando)
  </text>
</svg>
