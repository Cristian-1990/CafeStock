<svg xmlns="http://www.w3.org/2000/svg" width="900" height="780" viewBox="0 0 900 780" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="flechaAbajo" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,0 L5,10 z" fill="#6D4C41"/>
    </marker>
  </defs>

  <!-- Fondo -->
  <rect x="0" y="0" width="900" height="780" fill="#F5EFE6"/>

  <!-- Titulo -->
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#3E2723">CafeStock — Diagrama de Componentes</text>
  <text x="450" y="56" text-anchor="middle" font-size="12" font-style="italic" fill="#6D4C41">Arquitectura en capas — cada capa solo depende de la que tiene justo debajo</text>

  <!-- ===================== CAPA 1: Interfaz ===================== -->
  <g>
    <rect x="70" y="80" width="760" height="110" fill="#F5EFE6" stroke="#6D4C41" stroke-width="2"/>
    <rect x="70" y="80" width="6" height="110" fill="#C17817"/>
    <text x="826" y="98" text-anchor="end" font-size="11" font-style="italic" fill="#C17817">CafeStock.Blazor</text>
    <text x="450" y="112" text-anchor="middle" font-size="18" font-weight="bold" fill="#3E2723">Interfaz (Blazor Server)</text>
    <text x="94" y="138" font-size="13.5" fill="#2C2C2A">Páginas Razor + MudBlazor: presentan los datos y capturan las acciones del</text>
    <text x="94" y="158" font-size="13.5" fill="#2C2C2A">usuario (Productos, Vender, Compra, Facturas...). Genera PDF y envía email.</text>
  </g>

  <!-- Flecha 1 -->
  <line x1="450" y1="190" x2="450" y2="236" stroke="#6D4C41" stroke-width="2" marker-end="url(#flechaAbajo)"/>
  <text x="465" y="217" font-size="11" font-style="italic" fill="#6D4C41">usa</text>

  <!-- ===================== CAPA 2: Servicio ===================== -->
  <g>
    <rect x="70" y="240" width="760" height="110" fill="#F5EFE6" stroke="#6D4C41" stroke-width="2"/>
    <rect x="70" y="240" width="6" height="110" fill="#C17817"/>
    <text x="826" y="258" text-anchor="end" font-size="11" font-style="italic" fill="#C17817">CafeStock.Back — Services</text>
    <text x="450" y="272" text-anchor="middle" font-size="18" font-weight="bold" fill="#3E2723">Servicio</text>
    <text x="94" y="298" font-size="13.5" fill="#2C2C2A">Reglas de negocio: valida antes de persistir (ValidadorProducto...) y coordina</text>
    <text x="94" y="318" font-size="13.5" fill="#2C2C2A">entidades relacionadas (p. ej. registrar una venta resta stock y crea el registro).</text>
  </g>

  <!-- Flecha 2 -->
  <line x1="450" y1="350" x2="450" y2="396" stroke="#6D4C41" stroke-width="2" marker-end="url(#flechaAbajo)"/>
  <text x="465" y="377" font-size="11" font-style="italic" fill="#6D4C41">usa</text>

  <!-- ===================== CAPA 3: Repositorio ===================== -->
  <g>
    <rect x="70" y="400" width="760" height="110" fill="#F5EFE6" stroke="#6D4C41" stroke-width="2"/>
    <rect x="70" y="400" width="6" height="110" fill="#C17817"/>
    <text x="826" y="418" text-anchor="end" font-size="11" font-style="italic" fill="#C17817">CafeStock.Back — Repositories</text>
    <text x="450" y="432" text-anchor="middle" font-size="18" font-weight="bold" fill="#3E2723">Repositorio</text>
    <text x="94" y="458" font-size="13.5" fill="#2C2C2A">Persistencia con Entity Framework Core: mapea entidades a tablas y ejecuta</text>
    <text x="94" y="478" font-size="13.5" fill="#2C2C2A">las migraciones idempotentes al arrancar (crea tablas/columnas si faltan).</text>
  </g>

  <!-- Flecha 3 -->
  <line x1="450" y1="510" x2="450" y2="556" stroke="#6D4C41" stroke-width="2" marker-end="url(#flechaAbajo)"/>
  <text x="465" y="537" font-size="11" font-style="italic" fill="#6D4C41">lee/escribe</text>

  <!-- ===================== CAPA 4: Base de datos ===================== -->
  <g>
    <rect x="70" y="560" width="760" height="110" fill="#F5EFE6" stroke="#6D4C41" stroke-width="2"/>
    <rect x="70" y="560" width="6" height="110" fill="#C17817"/>
    <text x="826" y="578" text-anchor="end" font-size="11" font-style="italic" fill="#C17817">cafestock.db</text>
    <text x="450" y="592" text-anchor="middle" font-size="18" font-weight="bold" fill="#3E2723">Base de datos (SQLite)</text>
    <text x="94" y="618" font-size="13.5" fill="#2C2C2A">Un único archivo local con las tablas del dominio: Productos, Proveedores,</text>
    <text x="94" y="638" font-size="13.5" fill="#2C2C2A">Compras, LineasCompra, RegistrosCafe.</text>
  </g>

  <!-- ===================== LEYENDA ===================== -->
  <rect x="70" y="700" width="760" height="40" fill="#F5EFE6" stroke="#C17817" stroke-width="1.5"/>
  <text x="450" y="724" text-anchor="middle" font-size="13" fill="#3E2723">
    Las flechas son dependencias de arriba hacia abajo: la interfaz no conoce SQLite ni a la inversa, siempre a través de la capa de en medio
  </text>
</svg>
